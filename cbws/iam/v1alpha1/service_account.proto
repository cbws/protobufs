syntax = "proto3";

package cbws.iam.v1alpha1;

import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/cbws/go-cbws-grpc/cbws/iam/v1alpha1";
option java_multiple_files = true;
option java_package = "xyz.cbws.iam.v1alpha1";
option php_metadata_namespace = "Cbws\\IAM\\GRPC\\V1alpha1\\Metadata";
option php_namespace = "Cbws\\IAM\\GRPC\\V1alpha1";

// A service account: an identity for a workload rather than a person.
message ServiceAccount {
  option (google.api.resource) = {
    type: "iam.cbws.xyz/ServiceAccount"
    pattern: ["projects/{project}/serviceAccounts/{service_account}"]
  };

  // The resource name of the service account, in the form
  // `projects/{project}/serviceAccounts/{email}`, such as
  // `projects/my-project/serviceAccounts/my-app@my-project.iam-sa.cbws.xyz`.
  string name = 1;

  // The ID of the project that owns the service account, such as
  // `my-project`.
  string project_id = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The unique and stable ID of the service account, a UUID.
  string unique_id = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The email address of the service account, in the form
  // `{account_id}@{project}.iam-sa.cbws.xyz`. It identifies the account in
  // resource names and in policy members such as
  // `serviceAccount:my-app@my-project.iam-sa.cbws.xyz`.
  string email = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Optional. A human-readable name for the service account, at most 128
  // characters.
  string display_name = 6 [(google.api.field_behavior) = OPTIONAL];
}

// A service account key.
//
// A service account has two kinds of keys:
//
// * User-managed keys, which you create and delete. You keep the private
//   key, and CBWS keeps only the public key. You are responsible for
//   rotating them.
// * System-managed keys, which CBWS creates, rotates and deletes. Each is
//   valid for 14 days, and a new one is created before the newest expires.
//   CBWS uses them for
//   [GenerateAccessToken][cbws.iam.v1alpha1.IAMService.GenerateAccessToken],
//   [SignJwt][cbws.iam.v1alpha1.IAMService.SignJwt] and
//   [SignBlob][cbws.iam.v1alpha1.IAMService.SignBlob]. Their private keys
//   are never exposed.
//
// The public keys of a service account's current keys of both kinds are
// published as a JSON Web Key Set at
// `https://accounts.cbws.cloud/api/v1alpha1/serviceAccounts/jwk/{email}`.
// A new key can be used as soon as it is created, so fetch the key set again
// when a token names a key ID you do not have.
message ServiceAccountKey {
  option (google.api.resource) = {
    type: "iam.cbws.xyz/ServiceAccountKey"
    pattern: ["projects/{project}/serviceAccounts/{service_account}/keys/{key}"]
  };

  // The resource name of the key, in the form
  // `projects/{project}/serviceAccounts/{email}/keys/{key}`.
  string name = 1;

  // Whether the key is user-managed or system-managed.
  ServiceAccountKeyType key_type = 2;

  // The format of
  // [private_key_data][cbws.iam.v1alpha1.ServiceAccountKey.private_key_data].
  // Set only in the response of
  // [CreateServiceAccountKey][cbws.iam.v1alpha1.IAMService.CreateServiceAccountKey].
  ServiceAccountPrivateKeyType private_key_type = 3;

  // The algorithm and size of the key.
  ServiceAccountKeyAlgorithm key_algorithm = 4;

  // The private key, as a credentials file. Set only in the response of
  // [CreateServiceAccountKey][cbws.iam.v1alpha1.IAMService.CreateServiceAccountKey].
  //
  // The credentials file is a JSON object with the fields `type` (always
  // `service_account`), `project_name`, `private_key_id`, `private_key` (a
  // PKCS #8 private key in PEM format), `client_email` and `client_id`.
  // Keep it secure: it lets anyone who holds it act as the service account.
  bytes private_key_data = 5;

  // The public key, as an X.509 certificate in PEM format. Set only in the
  // response of
  // [GetServiceAccountKey][cbws.iam.v1alpha1.IAMService.GetServiceAccountKey].
  bytes public_key_data = 6;

  // The start of the key's validity.
  google.protobuf.Timestamp valid_after_time = 7;

  // The end of the key's validity. For a system-managed key, this is the
  // last moment it signs with. Its public key stays in the published key
  // set for a few hours after it, so that tokens it signed can still be
  // verified.
  google.protobuf.Timestamp valid_before_time = 8;
}

// The kind of a service account key.
enum ServiceAccountKeyType {
  // Not specified.
  SERVICE_ACCOUNT_KEY_TYPE_UNSPECIFIED = 0;

  // A key you create, rotate and delete.
  SERVICE_ACCOUNT_KEY_TYPE_USER_MANAGED = 1;

  // A key CBWS creates, rotates and deletes.
  SERVICE_ACCOUNT_KEY_TYPE_SYSTEM_MANAGED = 2;
}

// The algorithm and size of a service account key.
enum ServiceAccountKeyAlgorithm {
  // Not specified. A new key is a 2048-bit RSA key.
  SERVICE_ACCOUNT_KEY_ALGORITHM_UNSPECIFIED = 0;

  // A 1024-bit RSA key.
  SERVICE_ACCOUNT_KEY_ALGORITHM_RSA_1024 = 1;

  // A 2048-bit RSA key.
  SERVICE_ACCOUNT_KEY_ALGORITHM_RSA_2048 = 2;

  // A 4096-bit RSA key.
  SERVICE_ACCOUNT_KEY_ALGORITHM_RSA_4096 = 3;
}

// The format of a service account's private key.
enum ServiceAccountPrivateKeyType {
  // Not specified. Treated as the credentials file format.
  SERVICE_ACCOUNT_PRIVATE_KEY_TYPE_UNSPECIFIED = 0;

  // A JSON credentials file, described on
  // [private_key_data][cbws.iam.v1alpha1.ServiceAccountKey.private_key_data].
  SERVICE_ACCOUNT_PRIVATE_KEY_TYPE_CREDENTIALS_FILE = 2;
}
