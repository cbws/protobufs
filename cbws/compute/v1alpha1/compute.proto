syntax = "proto3";

package cbws.compute.v1alpha1;

import "cbws/compute/v1alpha1/image.proto";
import "cbws/compute/v1alpha1/machine.proto";
import "cbws/compute/v1alpha1/machine_type.proto";
import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/longrunning/operations.proto";
import "google/protobuf/field_mask.proto";

// Manages virtual machines, the machine types they run on and the images they
// boot from.
service ComputeService {
  option (google.api.default_host) = "compute.cbws.cloud";

  // Lists the machines in a project.
  rpc ListMachines(ListMachinesRequest) returns (ListMachinesResponse) {
    option (google.api.http) = {get: "/v1alpha1/{parent=projects/*}/machines"};
    option (google.api.method_signature) = "parent";
  }

  // Gets a machine.
  rpc GetMachine(GetMachineRequest) returns (Machine) {
    option (google.api.http) = {get: "/v1alpha1/{name=projects/*/machines/*}"};
    option (google.api.method_signature) = "name";
  }

  // Returns a URL that opens the console of a running machine in a browser.
  // A stopped machine has no console.
  rpc RequestMachineConsole(RequestMachineConsoleRequest) returns (RequestMachineConsoleResponse) {
    option (google.api.http) = {get: "/v1alpha1/{name=projects/*/machines/*}"};
    option (google.api.method_signature) = "name";
  }

  // Creates a machine and starts it.
  rpc CreateMachine(CreateMachineRequest) returns (google.longrunning.Operation) {
    option (google.api.http) = {
      post: "/v1/{parent=projects/*}/machines"
      body: "machine"
    };
    option (google.api.method_signature) = "parent,machine,machine_id";
    option (google.longrunning.operation_info) = {
      response_type: "Machine"
      metadata_type: "cbws.compute.v1alpha1.CreateMachineMetadata"
    };
  }

  // Stops a machine. The machine keeps its disk and can be started again.
  rpc StopMachine(StopMachineRequest) returns (google.longrunning.Operation) {
    option (google.api.http) = {
      post: "/v1/{name=projects/*/machines/*}:stop"
      body: "machine"
    };
    option (google.longrunning.operation_info) = {
      response_type: "StopMachineResponse"
      metadata_type: "cbws.compute.v1alpha1.StopMachineMetadata"
    };
  }

  // Starts a stopped machine.
  rpc StartMachine(StartMachineRequest) returns (google.longrunning.Operation) {
    option (google.api.http) = {
      post: "/v1/{name=projects/*/machines/*}:start"
      body: "machine"
    };
    option (google.longrunning.operation_info) = {
      response_type: "StartMachineResponse"
      metadata_type: "cbws.compute.v1alpha1.StartMachineMetadata"
    };
  }

  // Power-cycles a machine, like pressing its reset button. The operating
  // system is not shut down first.
  rpc ResetMachine(ResetMachineRequest) returns (google.longrunning.Operation) {
    option (google.api.http) = {
      post: "/v1/{name=projects/*/machines/*}:reset"
      body: "machine"
    };
    option (google.longrunning.operation_info) = {
      response_type: "ResetMachineResponse"
      metadata_type: "cbws.compute.v1alpha1.ResetMachineMetadata"
    };
  }

  // Replaces the operating system on a machine with a new image. The data on
  // the machine's disk is lost.
  rpc ReinstallMachine(ReinstallMachineRequest) returns (google.longrunning.Operation) {
    option (google.api.http) = {
      post: "/v1/{name=projects/*/machines/*}:reinstall"
      body: "machine"
    };
    option (google.longrunning.operation_info) = {
      response_type: "ReinstallMachineResponse"
      metadata_type: "cbws.compute.v1alpha1.ReinstallMachineMetadata"
    };
  }

  // Changes a machine to another machine type in the same zone. The machine
  // is turned off and on again.
  rpc ResizeMachine(ResizeMachineRequest) returns (google.longrunning.Operation) {
    option (google.api.http) = {
      post: "/v1/{name=projects/*/machines/*}:resize"
      body: "machine"
    };
    option (google.longrunning.operation_info) = {
      response_type: "ResizeMachineResponse"
      metadata_type: "cbws.compute.v1alpha1.ResizeMachineMetadata"
    };
  }

  // Deletes a machine and its disk.
  rpc DeleteMachine(DeleteMachineRequest) returns (google.longrunning.Operation) {
    option (google.api.http) = {delete: "/v1/{name=projects/*/machines/*}"};
    option (google.api.method_signature) = "name";
    option (google.longrunning.operation_info) = {
      response_type: "google.protobuf.Empty"
      metadata_type: "cbws.compute.v1alpha1.DeleteMachineMetadata"
    };
  }

  // Lists the machine types offered in a zone, or in every zone.
  rpc ListMachineTypes(ListMachineTypesRequest) returns (ListMachineTypesResponse) {
    option (google.api.http) = {get: "/v1alpha1/{parent=zones/*}/types"};
    option (google.api.method_signature) = "parent";
  }

  // Lists the images in a project.
  rpc ListImages(ListImagesRequest) returns (ListImagesResponse) {
    option (google.api.http) = {get: "/v1alpha1/{parent=projects/*}/images"};
    option (google.api.method_signature) = "parent";
  }
}

// The request to list machines.
message ListMachinesRequest {
  // Required. The project to list the machines of, such as
  // `projects/my-project-123`.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "projects.cbws.xyz/Project"}
  ];

  // Optional. The maximum number of machines to return. The service may
  // return fewer. Get further machines by passing
  // [ListMachinesResponse.next_page_token][cbws.compute.v1alpha1.ListMachinesResponse.next_page_token]
  // in a subsequent request.
  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];

  // Optional. The page token returned in an earlier
  // [ListMachinesResponse.next_page_token][cbws.compute.v1alpha1.ListMachinesResponse.next_page_token].
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];

  // Optional. The fields that take extra time to read and are wanted in the
  // response: `machines.image`, `machines.type` and `machines.status`, which
  // fills in each machine's `state`. Other fields are always returned. Without
  // a mask, all three are read.
  google.protobuf.FieldMask read_mask = 4 [(google.api.field_behavior) = OPTIONAL];
}

// The response to a request to list machines.
message ListMachinesResponse {
  // The machines in the project.
  repeated Machine machines = 1;

  // To retrieve the next page of results, set
  // [ListMachinesRequest.page_token][cbws.compute.v1alpha1.ListMachinesRequest.page_token]
  // to this value. Empty on the last page.
  string next_page_token = 2;
}

// The request to get a machine.
message GetMachineRequest {
  // Required. The resource name of the machine, such as
  // `projects/my-project-123/machines/web-1`.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "compute.cbws.cloud/Machine"}
  ];

  // Optional. The fields that take extra time to read and are wanted in the
  // response: `image`, `type` and `status`, which fills in `state`. Other
  // fields are always returned. Without a mask, all three are read.
  google.protobuf.FieldMask read_mask = 2 [(google.api.field_behavior) = OPTIONAL];
}

// The request to open the console of a machine.
message RequestMachineConsoleRequest {
  // Required. The resource name of the machine, such as
  // `projects/my-project-123/machines/web-1`.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "compute.cbws.cloud/Machine"}
  ];
}

// The console of a machine.
message RequestMachineConsoleResponse {
  // The protocol of the console, such as `vnc`.
  string protocol = 1;

  // The kind of console client the URL opens, such as `novnc`.
  string type = 2;

  // The URL that opens the console in a browser. Treat it as a secret: it
  // gives access to the console of the machine.
  string url = 3;
}

// The request to create a machine.
message CreateMachineRequest {
  // Required. The project to create the machine in, such as
  // `projects/my-project-123`.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "projects.cbws.xyz/Project"}
  ];

  // Required. The id of the machine, which becomes the last segment of its
  // name. It contains letters, digits and hyphens and ends with a letter or a
  // digit. Some machine types also require a lowercase id of at most 63
  // characters that starts with a letter or a digit.
  string machine_id = 2 [(google.api.field_behavior) = REQUIRED];

  // Required. The machine to create.
  Machine machine = 3 [(google.api.field_behavior) = REQUIRED];
}

// Not returned by any method: a create machine operation returns the
// [Machine][cbws.compute.v1alpha1.Machine] as its result.
message CreateMachineResponse {}

// The metadata of a create machine operation.
message CreateMachineMetadata {
  // The state of the machine as the operation last saw it.
  Machine.State state = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The machine being created.
  Machine machine = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// The request to stop a machine.
message StopMachineRequest {
  // Required. The resource name of the machine, such as
  // `projects/my-project-123/machines/web-1`.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "compute.cbws.cloud/Machine"}
  ];
}

// The result of a stop machine operation.
message StopMachineResponse {}

// The metadata of a stop machine operation.
message StopMachineMetadata {}

// The request to start a machine.
message StartMachineRequest {
  // Required. The resource name of the machine, such as
  // `projects/my-project-123/machines/web-1`.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "compute.cbws.cloud/Machine"}
  ];
}

// The result of a start machine operation.
message StartMachineResponse {}

// The metadata of a start machine operation.
message StartMachineMetadata {}

// The request to reset a machine.
message ResetMachineRequest {
  // Required. The resource name of the machine, such as
  // `projects/my-project-123/machines/web-1`.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "compute.cbws.cloud/Machine"}
  ];
}

// The result of a reset machine operation.
message ResetMachineResponse {}

// The metadata of a reset machine operation.
message ResetMachineMetadata {}

// The request to reinstall a machine.
message ReinstallMachineRequest {
  // Required. The resource name of the machine, such as
  // `projects/my-project-123/machines/web-1`.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "compute.cbws.cloud/Machine"}
  ];
}

// The result of a reinstall machine operation.
message ReinstallMachineResponse {}

// The metadata of a reinstall machine operation.
message ReinstallMachineMetadata {}

// The request to resize a machine.
message ResizeMachineRequest {
  // Required. The resource name of the machine, such as
  // `projects/my-project-123/machines/web-1`.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "compute.cbws.cloud/Machine"}
  ];

  // Required. The machine type to change to, such as
  // `zones/nl-ein-1/types/g4.2`, or `machineTypes/g4.2` for that type in the
  // machine's current zone. The type must be offered in the zone the machine
  // runs in. A resize to the machine's current type finishes without change.
  string type = 2 [(google.api.field_behavior) = INPUT_ONLY];
}

// The result of a resize machine operation.
message ResizeMachineResponse {}

// The metadata of a resize machine operation.
message ResizeMachineMetadata {}

// The request to delete a machine.
message DeleteMachineRequest {
  // Required. The resource name of the machine, such as
  // `projects/my-project-123/machines/web-1`.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "compute.cbws.cloud/Machine"}
  ];
}

// The metadata of a delete machine operation.
message DeleteMachineMetadata {}

// The request to list machine types.
message ListMachineTypesRequest {
  // Required. The zone to list the machine types of, such as `zones/nl-ein-1`.
  // Use `zones/-` to list the machine types of every zone.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "compute.cbws.cloud/Zone"}
  ];

  // Optional. The maximum number of machine types to return. The service may
  // return fewer. Get further machine types by passing
  // [ListMachineTypesResponse.next_page_token][cbws.compute.v1alpha1.ListMachineTypesResponse.next_page_token]
  // in a subsequent request.
  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];

  // Optional. The page token returned in an earlier
  // [ListMachineTypesResponse.next_page_token][cbws.compute.v1alpha1.ListMachineTypesResponse.next_page_token].
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];

  // Optional. The fields that take extra time to read and are wanted in the
  // response: only `machine_types.stock_status`. Other fields are always
  // returned. Without a mask, `stock_status` is read.
  google.protobuf.FieldMask read_mask = 4 [(google.api.field_behavior) = OPTIONAL];
}

// The response to a request to list machine types.
message ListMachineTypesResponse {
  // The machine types in the zone.
  repeated MachineType machine_types = 1;

  // To retrieve the next page of results, set
  // [ListMachineTypesRequest.page_token][cbws.compute.v1alpha1.ListMachineTypesRequest.page_token]
  // to this value. Empty on the last page.
  string next_page_token = 2;
}

// The request to list images.
message ListImagesRequest {
  // Required. The project to list the images of, such as
  // `projects/my-project-123`.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "projects.cbws.xyz/Project"}
  ];

  // Optional. The maximum number of images to return. The service may return
  // fewer. Get further images by passing
  // [ListImagesResponse.next_page_token][cbws.compute.v1alpha1.ListImagesResponse.next_page_token]
  // in a subsequent request.
  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];

  // Optional. The page token returned in an earlier
  // [ListImagesResponse.next_page_token][cbws.compute.v1alpha1.ListImagesResponse.next_page_token].
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Ignored: every image field is always returned.
  google.protobuf.FieldMask read_mask = 4 [(google.api.field_behavior) = OPTIONAL];
}

// The response to a request to list images.
message ListImagesResponse {
  // The images in the project.
  repeated Image images = 1;

  // To retrieve the next page of results, set
  // [ListImagesRequest.page_token][cbws.compute.v1alpha1.ListImagesRequest.page_token]
  // to this value. Empty on the last page.
  string next_page_token = 2;
}
