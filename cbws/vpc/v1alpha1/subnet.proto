syntax = "proto3";

package cbws.vpc.v1alpha1;

import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/field_mask.proto";

// A subnet: an IPv4 or IPv6 prefix on a private network, from which machines
// on that network get their addresses.
message Subnet {
  option (google.api.resource) = {
    type: "vpc.cbws.cloud/Subnet"
    pattern: ["projects/{project}/vpcs/{vpc}/privateNetworks/{privateNetwork}/subnets/{subnet}"]
  };

  // The resource name of the subnet, such as
  // `projects/my-project/vpcs/default/privateNetworks/nl-ein-1/subnets/subnet-1`.
  string name = 1 [(google.api.field_behavior) = IMMUTABLE];

  // The private network the subnet belongs to, such as
  // `projects/my-project/vpcs/default/privateNetworks/nl-ein-1`.
  string parent = 2 [(google.api.field_behavior) = IMMUTABLE];

  // The prefix of the subnet in CIDR notation, such as `10.0.0.0/24` or
  // `2001:db8::/64`. Required on create.
  //
  // Host bits are cleared, so `10.0.0.5/24` becomes `10.0.0.0/24`. A `/32`
  // or `/128` prefix is refused. The prefix must not overlap any other
  // subnet in the same VPC.
  // buf:lint:ignore FIELD_SAME_TYPE
  string prefix = 3 [(google.api.field_behavior) = IMMUTABLE];

  // The gateway address of the subnet: always the first address after the
  // network address, so `10.0.0.0/24` gives `10.0.0.1` and `2001:db8::/64`
  // gives `2001:db8::1`. It is set by the service.
  string gateway = 4 [(google.api.field_behavior) = IMMUTABLE];
}

// The subnet list request.
message ListSubnetsRequest {
  // Required. The private network to list the subnets of, such as
  // `projects/my-project/vpcs/default/privateNetworks/nl-ein-1`.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "vpc.cbws.cloud/PrivateNetwork"}
  ];

  // Optional. The maximum number of subnets to return, at most 25. Zero or a
  // larger value means the default of 10.
  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];

  // Optional. The
  // [next_page_token][cbws.vpc.v1alpha1.ListSubnetsResponse.next_page_token]
  // of a previous response, to get the next page.
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];

  // Optional. The fields to return. Without a mask, every field is returned.
  //
  // `prefix` and `gateway` are the slow fields to look up. A mask that names
  // neither `prefix` nor `gateway` (or `subnets.prefix` or
  // `subnets.gateway`) leaves both empty, which makes the call faster when
  // you only need the subnet names.
  google.protobuf.FieldMask read_mask = 4 [(google.api.field_behavior) = OPTIONAL];
}

// The subnet list response.
message ListSubnetsResponse {
  // The subnets of the private network.
  repeated Subnet subnets = 1;

  // The token to get the next page with, by setting it as
  // [page_token][cbws.vpc.v1alpha1.ListSubnetsRequest.page_token]. Empty on
  // the last page.
  string next_page_token = 2;
}

// The subnet get request.
message GetSubnetRequest {
  // Required. The resource name of the subnet, such as
  // `projects/my-project/vpcs/default/privateNetworks/nl-ein-1/subnets/subnet-1`.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "vpc.cbws.cloud/Subnet"}
  ];

  // Optional. The fields to return, as for
  // [ListSubnetsRequest.read_mask][cbws.vpc.v1alpha1.ListSubnetsRequest.read_mask].
  google.protobuf.FieldMask read_mask = 2 [(google.api.field_behavior) = OPTIONAL];
}

// The subnet create request.
message CreateSubnetRequest {
  // Required. The private network to create the subnet in, such as
  // `projects/my-project/vpcs/default/privateNetworks/nl-ein-1`.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "vpc.cbws.cloud/PrivateNetwork"}
  ];

  // Required. The ID of the subnet, which becomes the last segment of its
  // resource name, such as `subnet-1`. It may hold letters, digits and
  // hyphens, and must not end with a hyphen.
  string subnet_id = 2 [(google.api.field_behavior) = REQUIRED];

  // Required. The subnet to create. Only `prefix` is read, and it is
  // required. The gateway is derived from the prefix.
  Subnet subnet = 3 [(google.api.field_behavior) = REQUIRED];
}

// The response of a subnet create operation. It has no fields: the subnet is
// in the operation's [metadata][cbws.vpc.v1alpha1.CreateSubnetMetadata].
message CreateSubnetResponse {}

// The metadata of a subnet create operation.
message CreateSubnetMetadata {
  // The created subnet, with its prefix and gateway.
  Subnet subnet = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// The subnet delete request.
message DeleteSubnetRequest {
  // Required. The resource name of the subnet, such as
  // `projects/my-project/vpcs/default/privateNetworks/nl-ein-1/subnets/subnet-1`.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "vpc.cbws.cloud/Subnet"}
  ];
}

// The response of a subnet delete operation. It has no fields.
message DeleteSubnetResponse {}

// The metadata of a subnet delete operation. It has no fields.
message DeleteSubnetMetadata {}
